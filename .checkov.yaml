# .checkov.yaml
directory:
  - terraform
framework:
  - terraform

skip-check:
  # ALB is internet-facing by design; port 80 kept for HTTP->HTTPS redirect.
  - CKV_AWS_260
  # NAT Gateway EIP — checkov only recognizes EC2-attached EIPs; false
  # positive for NAT Gateway attachments (known checkov limitation).
  - CKV2_AWS_19
  # SGs created in Foundation, attached in compute/data-tier's own state
  # (ADR 0001: layered per-module state). Checkov can't trace attachment
  # across terraform_remote_state — permanent, not a bug.
  - CKV2_AWS_5
  # CloudWatch Logs default (AWS-managed) encryption is sufficient for this
  # dev capstone; a customer-managed KMS key is a production consideration.
  - CKV_AWS_158
  # Default SG is genuinely locked down (aws_default_security_group, empty
  # ingress/egress — live-verified via aws ec2 describe-security-groups:
  # In: [], Out: []). Checkov's static graph doesn't trace the relationship
  # across the networking/security module boundary — same limitation class
  # as CKV2_AWS_5, confirmed across 3 consecutive scans.
  - CKV2_AWS_12
  # deploy_foundation policy: reviewed action-by-action against the AWS EC2
  # IAM reference. Remaining wildcard actions (DeleteVpc, ModifyVpcAttribute,
  # ModifySubnetAttribute, ReleaseAddress, DetachInternetGateway,
  # DisassociateRouteTable, ReplaceRoute, ReplaceRouteTableAssociation, all
  # Describe*) have no resource-level or tag-condition support in AWS IAM.
  # Everything else is tag-conditioned. Confirmed unavoidable, not an oversight.
  - CKV_AWS_356
  - CKV_AWS_111
  # App-artifact bucket (compute module) holds redeployable code zips,
  # rebuilt from app/src in git on every deploy.sh run — not sensitive
  # data. Access logging would need a separate logging-target bucket for
  # negligible benefit at this scale.
  - CKV_AWS_18
  # Same trade-off as CKV_AWS_158 above: SSE-S3 (AES256) already covers
  # encryption at rest. A customer-managed KMS key adds ~$1/mo + key-policy
  # overhead for a bucket with nothing sensitive in it.
  - CKV_AWS_145
  # No consumer for bucket-change notifications on the app-artifact bucket —
  # deploy.sh explicitly triggers the ASG instance refresh itself; nothing
  # else needs to react to object-create events here.
  - CKV2_AWS_62
  # App-artifact bucket contents are fully reproducible from app/src in
  # git — if lost, deploy.sh just re-runs and re-uploads. No DR value in
  # replicating a rebuildable deploy artifact cross-region.
  - CKV_AWS_144

compact: true
quiet: true