# .checkov.yaml
directory:
  - terraform
framework:
  - terraform

skip-check:
  # ALB is internet-facing by design; port 80 kept for HTTP->HTTPS redirect.
  - CKV_AWS_260
  # NAT Gateway EIP — checkov only recognizes EC2-attached EIPs; false
  # positive for NAT Gateway attachments (known checkov limitation).
  - CKV2_AWS_19
  # SGs created in Foundation, attached in compute/data-tier's own state
  # (ADR 0001: layered per-module state). Checkov can't trace attachment
  # across terraform_remote_state — permanent, not a bug.
  - CKV2_AWS_5
  # CloudWatch Logs default (AWS-managed) encryption is sufficient for this
  # dev capstone; a customer-managed KMS key is a production consideration.
  - CKV_AWS_158
  # Default SG is genuinely locked down (aws_default_security_group, empty
  # ingress/egress — live-verified via aws ec2 describe-security-groups:
  # In: [], Out: []). Checkov's static graph doesn't trace the relationship
  # across the networking/security module boundary — same limitation class
  # as CKV2_AWS_5, confirmed across 3 consecutive scans.
  - CKV2_AWS_12
  # deploy_foundation policy: reviewed action-by-action against the AWS EC2
  # IAM reference. Remaining wildcard actions (DeleteVpc, ModifyVpcAttribute,
  # ModifySubnetAttribute, ReleaseAddress, DetachInternetGateway,
  # DisassociateRouteTable, ReplaceRoute, ReplaceRouteTableAssociation, all
  # Describe*) have no resource-level or tag-condition support in AWS IAM.
  # Everything else is tag-conditioned. Confirmed unavoidable, not an oversight.
  - CKV_AWS_356
  - CKV_AWS_111
  # App-artifact bucket (compute module) holds redeployable code zips,
  # rebuilt from app/src in git on every deploy.sh run — not sensitive
  # data. Access logging would need a separate logging-target bucket for
  # negligible benefit at this scale.
  - CKV_AWS_18
  # Same trade-off as CKV_AWS_158 above: SSE-S3 (AES256) already covers
  # encryption at rest. A customer-managed KMS key adds ~$1/mo + key-policy
  # overhead for a bucket with nothing sensitive in it.
  - CKV_AWS_145
  # No consumer for bucket-change notifications on the app-artifact bucket —
  # deploy.sh explicitly triggers the ASG instance refresh itself; nothing
  # else needs to react to object-create events here.
  - CKV2_AWS_62
  # App-artifact bucket contents are fully reproducible from app/src in
  # git — if lost, deploy.sh just re-runs and re-uploads. No DR value in
  # replicating a rebuildable deploy artifact cross-region.
  - CKV_AWS_144
  # ALB deletion protection deliberately off -- it's gated behind
  # enable_billable_resources and meant to be destroyed/recreated between
  # work sessions to control cost. Deletion protection would block that.
  - CKV_AWS_150
  # Same trade-off as the app-artifact bucket (CKV_AWS_18 above): ALB
  # access logging needs its own S3 bucket + policy for negligible benefit
  # at this traffic volume (capstone demo, not production load).
  - CKV_AWS_91
  # HTTPS listener + ACM cert are the Route53/ACM module's scope (see
  # 00-shared-context.md), not built yet. This HTTP listener is complete
  # for now; a companion HTTPS listener and TLS policy land there.
  - CKV_AWS_2
  - CKV_AWS_103
  # ALB-to-target traffic stays HTTP within the private VPC (target group
  # only reachable via app-sg, itself only reachable from alb-sg). TLS
  # terminates at the ALB edge once the HTTPS listener lands; full
  # edge-to-instance TLS needs per-instance certs, out of scope at this
  # scale without a service mesh.
  - CKV_AWS_378
  # WAF is a planned resource for this project (00-shared-context.md's
  # on/off toggle list includes it) but isn't built yet — not this
  # module's scope. Will attach to this ALB when it lands.
  - CKV2_AWS_28
    # Single-AZ RDS and single-node ElastiCache (no automatic failover) are
  # locked decisions -- see 00-shared-context.md and COSTS.md's Data Tier
  # section. Multi-AZ/failover documented as the production recommendation.
  - CKV_AWS_157
  - CKV2_AWS_50
  # RDS deletion protection deliberately off -- same trade-off as
  # CKV_AWS_150 (ALB) above: this instance is gated behind
  # enable_billable_resources and meant to be destroyed/recreated between
  # work sessions. Deletion protection would block that toggle.
  - CKV_AWS_293
  # Same trade-off as CKV_AWS_158/CKV_AWS_145 above: default AWS-managed
  # encryption (RDS storage_encrypted, ElastiCache at-rest, Secrets Manager)
  # already covers encryption at rest. A customer-managed KMS key adds
  # ~$1/mo + key-policy overhead per resource for a dev capstone with
  # nothing sensitive enough to warrant it.
  - CKV_AWS_191
  - CKV_AWS_149
  # RDS Performance Insights: unsupported on t3/t4g.micro for MySQL/MariaDB
  # per AWS docs; PostgreSQL support at this instance class is unconfirmed
  # in the docs and not worth risking an apply-time rejection to test
  # against a live environment for a discretionary observability feature.
  # Revisit if this instance is ever upsized past *.micro.
  - CKV_AWS_353
  # RDS Enhanced Monitoring: adds an IAM monitoring role plus ongoing
  # CloudWatch Logs ingestion for OS-level metrics at 1-60s granularity --
  # not warranted at this scale; CloudWatch agent + basic RDS metrics
  # (already the observability module's job) cover this capstone's needs.
  - CKV_AWS_118
  # RDS IAM database authentication: would need the app's DB connection
  # code to switch from the Secrets Manager password pattern (used
  # consistently everywhere else in this project -- S3, this same
  # instance) to IAM auth tokens. Orthogonal redesign, out of scope here.
  - CKV_AWS_161
  # Deep Postgres query logging (log_statement) needs a custom DB
  # parameter group and adds log volume/cost for a discretionary
  # observability enhancement -- CKV_AWS_129 (server log export to
  # CloudWatch) is enabled instead, which already covers connections,
  # errors, and general server activity.
  - CKV2_AWS_30
  # Secrets Manager automatic rotation needs a dedicated Lambda rotation
  # function -- real infra for dev/demo credentials that get destroyed and
  # regenerated with the resource anyway (RDS/ElastiCache toggle). A
  # production deployment would add this.
  - CKV2_AWS_57
  # ALB has no HTTPS listener yet -- HTTP-only until the Route53+ACM
  # module ships (see 00-shared-context.md's Domain & DNS facts). Can't
  # redirect to HTTPS when there's no HTTPS listener to redirect to yet.
  # Remove this skip once that module adds the ACM listener + redirect
  # action -- this check should then genuinely pass.
  - CKV2_AWS_20
compact: true
quiet: true